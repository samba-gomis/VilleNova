<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VilleNova — Carte interactive des événements culturels de la ville">
  <title>Carte — VilleNova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/webp" href="../images/VilleNova.webp">
  <!-- Leaflet CSS — open-source, ~5 KB gzip -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="../styles/carte.css">
</head>
<body class="page-carte">

  <a href="#main" class="skip-link">Aller au contenu</a>

  <nav aria-label="Navigation principale">
    <div class="w">
      <a href="../index.html" class="logo" aria-label="VilleNova accueil">
        <img src="../images/VilleNova.webp" alt="VilleNova" width="160" height="54" loading="eager">
      </a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <ul id="nav-menu" role="list">
        <li><a href="../index.html">Agenda</a></li>
        <li><a href="carte.html" aria-current="page">Carte</a></li>
        <li><a href="partenaires.html">Partenaires</a></li>
        <li><a href="about.html">À propos</a></li>
        <li><a href="favorites.html" class="nav-cta">Mes favoris</a></li>
      </ul>
      <button class="nav-theme" id="theme-toggle" aria-label="Changer le thème" title="Mode sombre">☀</button>
    </div>
  </nav>

  <main id="main">

    <!-- stats + legend bar -->
    <div class="map-bar" role="region" aria-label="Légende de la carte">
      <div class="w">
        <p class="map-count">
          <strong id="map-count">—</strong> événements localisés
        </p>
        <ul class="map-legend" aria-label="Couleurs par catégorie" role="list">
          <li class="map-legend-item">
            <span class="map-legend-dot" style="color:#E8501A;" aria-hidden="true"></span>Concerts
          </li>
          <li class="map-legend-item">
            <span class="map-legend-dot" style="color:#0D9488;" aria-hidden="true"></span>Expositions
          </li>
          <li class="map-legend-item">
            <span class="map-legend-dot" style="color:#7C3AED;" aria-hidden="true"></span>Spectacles
          </li>
          <li class="map-legend-item">
            <span class="map-legend-dot" style="color:#2563EB;" aria-hidden="true"></span>Cinéma
          </li>
          <li class="map-legend-item">
            <span class="map-legend-dot" style="color:#DB2777;" aria-hidden="true"></span>Danse
          </li>
          <li class="map-legend-item">
            <span class="map-legend-dot" style="color:#16A34A;" aria-hidden="true"></span>Ateliers
          </li>
        </ul>
      </div>
    </div>

    <!-- map -->
    <div class="map-wrap">
      <div id="map" aria-label="Carte interactive des événements"></div>
      <div class="map-loading" id="map-loading" aria-live="polite">Chargement de la carte…</div>
      <div class="map-error" id="map-error" hidden role="alert">
        Impossible de charger les événements. Vérifiez votre connexion.
      </div>
    </div>

  </main>

  <!-- Leaflet JS — open-source, ~42 KB gzip -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../scripts/utils.js"></script>
  <script src="../scripts/theme.js"></script>
  <script src="../scripts/nav.js"></script>
  <script src="../scripts/map.js"></script>
</body>
</html>
